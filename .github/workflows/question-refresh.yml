name: Question Bank Refresh

# Generates questions directly on the GitHub runner (free for this public repo)
# instead of calling the Vercel API, so it keeps working when Vercel deploys are
# blocked and isn't cut off by the serverless timeout. One chapter per hour
# stays within Groq's free daily token allowance.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      board:
        description: "Optional board name or id"
        required: false
      className:
        description: "Optional class name"
        required: false
      subject:
        description: "Optional subject"
        required: false
      chapter:
        description: "Optional chapter"
        required: false
      limit:
        description: "How many chapter sets to refresh"
        required: false
        default: "1"
      forceRegenerate:
        description: "Replace existing rows with a fresh source-backed set"
        required: false
        default: "true"

concurrency:
  group: question-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate questions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GROQ_FALLBACK_MODELS: openai/gpt-oss-120b,openai/gpt-oss-20b
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOARD: ${{ inputs.board }}
          CLASS_NAME: ${{ inputs.className }}
          SUBJECT: ${{ inputs.subject }}
          CHAPTER: ${{ inputs.chapter }}
          LIMIT: ${{ inputs.limit || '1' }}
          FORCE_REGENERATE: ${{ inputs.forceRegenerate || 'true' }}
        run: npx --yes tsx@4 --tsconfig tsconfig.json scripts/refresh-questions.ts
